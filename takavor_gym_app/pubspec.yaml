name: takavor_gym_app
description: نرم‌افزار مدیریت باشگاه بدنسازی تکاور - Professional Gym Management Desktop Application
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^13.2.0
  
  # Database
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Date/Time (Shamsi/Persian)
  shamsi_date: ^1.0.4
  
  # PDF Export
  pdf: ^3.10.7
  
  # CSV Export
  csv: ^5.1.1
  
  # Window Management (Desktop)
  window_manager: ^0.3.8
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Icons
  flutter_svg: ^2.0.9
  
  # Image Processing for glass effect
  image: ^4.1.3
  
  # Utilities
  intl: ^0.18.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  drift_dev: ^2.15.0
  custom_lint: ^0.5.7
  riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true
  
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
  
  assets:
    - assets/images/
    - assets/fonts/
